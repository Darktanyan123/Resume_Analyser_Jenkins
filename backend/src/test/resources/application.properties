spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.mongodb.uri=mongodb://localhost:27017/cv_screening_test

jwt.secret=test-only-secret-for-unit-test-config-at-least-32-bytes
jwt.expiration=86400000

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads/resumes
