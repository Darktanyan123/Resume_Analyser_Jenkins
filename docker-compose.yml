# ==========================================================
# Docker Compose - Resume Analyser (Full Stack + Database)
# Tích hợp trọn gói MongoDB + Backend + Frontend
# ==========================================================

services:

  # --- Database MongoDB ---
  mongodb:
    image: mongo:7
    container_name: resume-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Lưu trữ dữ liệu vĩnh viễn
      - mongo-data:/data/db
      # Tự động nạp cấu trúc & dữ liệu cv_screening khi khởi chạy lần đầu
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - resume-network
    restart: always

  # --- Backend (Spring Boot API) ---
  backend:
    image: ${BACKEND_IMAGE:-antony1552006/resume-backend}:${VERSION:-latest}
    container_name: resume-backend
    ports:
      - "8081:8080"
    environment:
      # Kết nối trực tiếp tới container mongodb bên trên qua tên service
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/cv_screening
    depends_on:
      - mongodb
    networks:
      - resume-network
    restart: always

  # --- Frontend (React + Nginx) ---
  frontend:
    image: ${FRONTEND_IMAGE:-antony1552006/resume-frontend}:${VERSION:-latest}
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

# Volume lưu trữ dữ liệu database lâu dài
volumes:
  mongo-data:

# Network kết nối 3 container
networks:
  resume-network:
    name: resume-network
    external: true