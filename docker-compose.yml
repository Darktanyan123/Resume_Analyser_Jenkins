#thiếu network, nếu muốn kết nối các container với nhau thì cần khai báo network.
#code commit -> lấy code -> đóng gói docker-compose.yml
services:
#Thiếu network, nếu muốn kết nối các container với nhau thì cần khai báo network, 

  # --- Backend (Spring Boot) ---
  backend:
  # nặng, chỉ run k build
    build:
    #context nặng rất lâu
      context: ./backend
    container_name: resume-backend
    ports:
      - "8080:8080"
    environment:
      # Dùng host.docker.internal để truy cập container local-mongo
      # đang chạy trên máy host (port 27017)
      # internal sai,  nếu mongodb:27017 phải là network, còn host.docker.internal là truy cập từ máy host
      - SPRING_MONGODB_URI=mongodb://host.docker.internal:27017/cv_screening 


  # --- Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
