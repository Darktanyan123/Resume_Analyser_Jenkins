# ==========================================================
# Docker Compose - Resume Analyser (Production/Deployment)
# Không build context trực tiếp - Chỉ chạy Images từ Registry
# ==========================================================

services:

  # --- Backend (Spring Boot API) ---
  backend:
    # Lấy image và tag từ file .env (sinh tự động từ Jenkins)
    image: ${BACKEND_IMAGE:-antony1552006/resume-backend}:${VERSION:-latest}
    container_name: resume-backend
    ports:
      - "8080:8080"
    environment:
      # Kết nối MongoDB:
      # Nếu container mongo nằm trong cùng resume-network: dùng mongodb://local-mongo:27017/cv_screening
      - SPRING_MONGODB_URI=mongodb://local-mongo:27017/cv_screening
    networks:
      - resume-network
    restart: always

  # --- Frontend (React + Nginx) ---
  frontend:
    # Lấy image và tag từ file .env (sinh tự động từ Jenkins)
    image: ${FRONTEND_IMAGE:-antony1552006/resume-frontend}:${VERSION:-latest}
    container_name: resume-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resume-network
    restart: always

# Network dùng chung giữa các container và database local-mongo
networks:
  resume-network:
    external: true